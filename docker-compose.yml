# docker-compose.yml
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app/app
      - ./utils:/app/utils  # Mount utils directory
      - ./alembic:/app/alembic  # Mount alembic directory  
      - ./alembic.ini:/app/alembic.ini  # Mount alembic config file
    ports:
      - "8001:8000"
    # Explicitly load from .env file to ensure all variables are from environment
    env_file:
      - .env
    environment:
      # Backend-specific overrides (these take precedence over .env)
      - APP_ENV=${APP_ENV:-development}  # Read from .env file
      - PORT=${PORT:-8000}               # Backend port only
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}  # Docker service name override
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Build-time arguments (`args`) are used to bake environment variables
      # into the static frontend assets during the `next build` process.
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH}
    ports:
      - "3001:3000"
    # Load from .env file but override specific variables to prevent conflicts
    env_file:
      - .env
    environment:
      # Frontend-specific overrides (NO PORT variable to prevent conflict!)
      - NODE_ENV=development
      # These override any values from .env to ensure correct frontend behavior
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      # Explicitly unset PORT to prevent frontend from using backend's PORT=8000
      - PORT=
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

# Define the shared network
networks:
  app-network:
    driver: bridge
