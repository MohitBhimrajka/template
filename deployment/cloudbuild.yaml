# ===================================================================
#      GOOGLE CLOUD BUILD CONFIGURATION
# -------------------------------------------------------------------
#  Automated CI/CD pipeline for building and deploying
#  FastAPI backend and Next.js frontend to Cloud Run
# ===================================================================

# Substitutions for Cloud Build triggers
substitutions:
  # Service names
  _BACKEND_SERVICE: 'your-app-backend'
  _FRONTEND_SERVICE: 'your-app-frontend'
  
  # Image registry and tags  
  _REGISTRY: 'gcr.io'
  _IMAGE_TAG: '${SHORT_SHA}'
  
  # Cloud Run configuration
  _REGION: 'us-central1'
  _MEMORY: '1Gi'
  _CPU: '1'
  _MAX_INSTANCES: '10'
  _MIN_INSTANCES: '0'
  _TIMEOUT: '300'
  _CONCURRENCY: '80'
  
  # Environment configuration
  _APP_ENV: 'production'
  _LOG_LEVEL: 'INFO'
  
  # Frontend URL configuration (set this when creating the build trigger)
  _NEXT_PUBLIC_API_URL: 'https://your-backend-service-url.run.app'

# Build steps
steps:
  # Step 1: Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGISTRY}/$PROJECT_ID/backend:${_IMAGE_TAG}'
      - '-t' 
      - '${_REGISTRY}/$PROJECT_ID/backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    waitFor: ['-']  # Start immediately

  # Step 2: Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    dir: 'frontend'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGISTRY}/$PROJECT_ID/frontend:${_IMAGE_TAG}'
      - '-t'
      - '${_REGISTRY}/$PROJECT_ID/frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BASE_PATH='
      - '-f'
      - 'Dockerfile'
      - '.'
    waitFor: ['-']  # Start immediately

  # Step 3: Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGISTRY}/$PROJECT_ID/backend'
    waitFor: ['build-backend']

  # Step 4: Push Frontend Image  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGISTRY}/$PROJECT_ID/frontend'
    waitFor: ['build-frontend']

  # Step 5: Deploy Backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-backend'
    args:
      - 'run'
      - 'deploy'
      - '${_BACKEND_SERVICE}'
      - '--image=${_REGISTRY}/$PROJECT_ID/backend:${_IMAGE_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--concurrency=${_CONCURRENCY}'
      - '--timeout=${_TIMEOUT}'
      - '--port=8000'
      - '--set-env-vars=APP_ENV=${_APP_ENV}'
      - '--set-env-vars=LOG_LEVEL=${_LOG_LEVEL}'
      - '--set-env-vars=DATABASE_URL=$$DATABASE_URL'
      - '--set-env-vars=FRONTEND_URL=$$FRONTEND_URL'
      - '--allow-unauthenticated'
    secretEnv: 
      - 'DATABASE_URL'
      - 'FRONTEND_URL'
    waitFor: ['push-backend']

  # Step 6: Deploy Frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-frontend'
    args:
      - 'run'
      - 'deploy'
      - '${_FRONTEND_SERVICE}'
      - '--image=${_REGISTRY}/$PROJECT_ID/frontend:${_IMAGE_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--concurrency=${_CONCURRENCY}'
      - '--timeout=${_TIMEOUT}'
      - '--port=3000'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-env-vars=NEXT_PUBLIC_API_URL=$$NEXT_PUBLIC_API_URL'
      - '--set-env-vars=NEXT_PUBLIC_BASE_PATH='
      - '--allow-unauthenticated'
    secretEnv:
      - 'NEXT_PUBLIC_API_URL'
    waitFor: ['push-frontend', 'deploy-backend']

  # Step 7: Run Database Migrations (optional)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'run-migrations'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Get the backend service URL
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)')
        
        echo "Backend service deployed at: $$BACKEND_URL"
        echo "Migrations are handled automatically by the application on startup"
        
        # Optional: Trigger a health check to ensure migrations ran
        sleep 30
        curl -f "$$BACKEND_URL/api/health" || echo "Health check failed - check application logs"
    waitFor: ['deploy-backend']

# Available secrets (configure these in Secret Manager)
availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/database-url/versions/latest'
      env: 'DATABASE_URL'
    - versionName: 'projects/$PROJECT_ID/secrets/frontend-url/versions/latest'
      env: 'FRONTEND_URL'
    - versionName: 'projects/$PROJECT_ID/secrets/next-public-api-url/versions/latest'
      env: 'NEXT_PUBLIC_API_URL'

# Build configuration
options:
  # Use high-performance machine type for faster builds
  machineType: 'E2_HIGHCPU_8'
  
  # Disk size for build
  diskSizeGb: 100
  
  # Build timeout (20 minutes)
  timeout: '1200s'
  
  # Logging options
  logging: CLOUD_LOGGING_ONLY
  
  # Substitute environment variables
  substitution_option: 'ALLOW_LOOSE'
  
  # Request a specific pool if you have one configured
  # pool:
  #   name: 'projects/$PROJECT_ID/locations/${_REGION}/workerPools/my-pool'

# Build artifacts (images will be stored in Container Registry)
images:
  - '${_REGISTRY}/$PROJECT_ID/backend:${_IMAGE_TAG}'
  - '${_REGISTRY}/$PROJECT_ID/backend:latest'
  - '${_REGISTRY}/$PROJECT_ID/frontend:${_IMAGE_TAG}'
  - '${_REGISTRY}/$PROJECT_ID/frontend:latest'

# Tags for organizing builds
tags: 
  - 'cloud-run-deployment'
  - 'backend-frontend'
  - '${BRANCH_NAME}'

# ===================================================================
# SETUP INSTRUCTIONS
# -------------------------------------------------------------------
# 
# 1. Enable required APIs:
#    gcloud services enable cloudbuild.googleapis.com
#    gcloud services enable secretmanager.googleapis.com
#    gcloud services enable run.googleapis.com
#
# 2. Create secrets in Secret Manager:
#    gcloud secrets create database-url --data-file=<(echo "your-database-url")
#    gcloud secrets create frontend-url --data-file=<(echo "your-frontend-url") 
#    gcloud secrets create next-public-api-url --data-file=<(echo "your-api-url")
#
# 3. Grant Cloud Build service account access to secrets:
#    PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format="value(projectNumber)")
#    gcloud secrets add-iam-policy-binding database-url \
#      --member="serviceAccount:$PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/secretmanager.secretAccessor"
#
# 4. Create Cloud Build trigger:
#    gcloud builds triggers create github \
#      --repo-name=your-repo-name \
#      --repo-owner=your-github-username \
#      --branch-pattern=main \
#      --build-config=deployment/cloudbuild.yaml \
#      --substitutions=_BACKEND_SERVICE=your-backend,_FRONTEND_SERVICE=your-frontend,_NEXT_PUBLIC_API_URL=https://your-backend-url.run.app
#
# 5. Manual build:
#    gcloud builds submit --config=deployment/cloudbuild.yaml \
#      --substitutions=_BACKEND_SERVICE=your-backend,_FRONTEND_SERVICE=your-frontend,_NEXT_PUBLIC_API_URL=https://your-backend-url.run.app
#
# ===================================================================
